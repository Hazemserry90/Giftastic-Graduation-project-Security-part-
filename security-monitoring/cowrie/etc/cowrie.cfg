# Cowrie operator configuration for the Giftastic lab.
#
# Bundled defaults live in the image (cowrie.data/cowrie.cfg.dist); this file
# only overrides what the lab needs. Every option can also be overridden with a
# COWRIE_<SECTION>_<OPTION> environment variable.

[honeypot]
# Decoy identity. Make it plausible for a marketplace vendor environment.
hostname = giftastic-vendor-svr01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
share_path = share/cowrie
state_path = var/lib/cowrie
etc_path = etc
data_path = src/cowrie/data
# Label this honeypot in every event so the SIEM can tell decoy traffic apart.
sensor_name = cowrie-giftastic

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# Advertise an older, plausible OpenSSH banner.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# JSON output is what the Wazuh JSON decoder consumes.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
