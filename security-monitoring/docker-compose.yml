# Giftastic defense-in-depth security monitoring lab
#
#   Wazuh manager + indexer + dashboard  -> SIEM / XDR
#   Cowrie                               -> SSH/Telnet honeypot (profile: cowrie)
#   Giftastic backend audit log          -> application/detection telemetry
#
# Quick start (Linux/macOS host with Docker Engine + Compose v2):
#
#   cp .env.example .env
#   docker compose --profile certs run --rm generator     # once, generates TLS certs
#   docker compose up -d                                  # Wazuh stack
#   docker compose --profile cowrie up -d                 # add the honeypot
#
# Dashboard: https://localhost  (accept the self-signed certificate)
#
# This is a LAB. It publishes TLS, SSH, and API ports for demonstration and the
# default credentials are well known. Never expose it to the internet.
name: giftastic-security-lab

services:
  # ---------------------------------------------------------------------------
  # Wazuh manager: analysis engine, rule matching, agent management.
  # ---------------------------------------------------------------------------
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.8}
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Giftastic + Cowrie custom detections.
      - ./wazuh/rules:/var/ossec/etc/rules:ro
      # External telemetry: Giftastic security-audit.log and Cowrie's JSON log.
      # Mounted OUTSIDE /var/ossec/logs because logcollector does not reliably
      # monitor files inside its own log directory.
      - ${LAB_LOG_DIR:-./logs}:/external-logs:ro

  # ---------------------------------------------------------------------------
  # Wazuh indexer: stores alerts and events (OpenSearch fork).
  # ---------------------------------------------------------------------------
  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.8}
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  # ---------------------------------------------------------------------------
  # Wazuh dashboard: analyst UI.
  # ---------------------------------------------------------------------------
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.8}
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-kibanaserver}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-kibanaserver}
      - API_USERNAME=${API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  # ---------------------------------------------------------------------------
  # ONE-TIME certificate generator (profile: certs).
  #   docker compose --profile certs run --rm generator
  # ---------------------------------------------------------------------------
  generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    profiles: ["certs"]
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml

  # ---------------------------------------------------------------------------
  # Cowrie SSH/Telnet honeypot (profile: cowrie).
  # Attacker commands, credentials, and sessions are written as JSON to the
  # shared ./logs/cowrie directory, which the manager ingests read-only.
  #
  # The honeypot is a DECOY. Do not point real users at these ports and do not
  # reuse any credential entered here.
  # ---------------------------------------------------------------------------
  cowrie:
    image: cowrie/cowrie:${COWRIE_VERSION:-3.1.0}
    hostname: cowrie
    profiles: ["cowrie"]
    restart: unless-stopped
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222"
      - "${COWRIE_TELNET_PORT:-2223}:2223"
    volumes:
      - ./cowrie/etc:/cowrie/cowrie-git/etc
      - ${LAB_LOG_DIR:-./logs}/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-var:/cowrie/cowrie-git/var/lib/cowrie
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  cowrie-var:
