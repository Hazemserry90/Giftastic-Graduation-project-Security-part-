<!--
  Wazuh agent configuration for a Windows host running the Giftastic backend
  (for example a developer workstation running `mvnw spring-boot:run`).

  Install the agent with the MSI, point <address> at the Wazuh manager, merge
  the <localfile> and <syscheck> blocks below into the agent's ossec.conf
  (typically C:\Program Files (x86)\ossec-agent\ossec.conf), then restart the
  "Wazuh" Windows service.

  Use double backslashes in Windows paths inside the XML.
-->
<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!--
    Giftastic structured security audit log.
    The backend default is `logs\security-audit.log` relative to its working
    directory. Override SECURITY_AUDIT_LOG_FILE to point at a stable path.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>C:\\Giftastic\\logs\\security-audit.log</location>
  </localfile>

  <!-- Spring Boot application log (plain text). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>C:\\Giftastic\\logs\\giftastic-application.log</location>
  </localfile>

  <!-- Windows event channel for account and process activity. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- File integrity monitoring for the deployed application and configuration. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes">C:\\Giftastic</directories>
    <ignore type="sregex">\.log$|\.tmp$</ignore>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
</ossec_config>
