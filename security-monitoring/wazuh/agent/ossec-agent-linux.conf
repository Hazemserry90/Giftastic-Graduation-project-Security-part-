<!--
  Wazuh agent configuration for a Linux host running the Giftastic backend.

  Install the agent, point <address> at the Wazuh manager, then merge the
  <localfile> and <syscheck> blocks below into /var/ossec/etc/ossec.conf and
  restart the agent:

      sudo systemctl restart wazuh-agent

  The <address> value in a Docker deployment is the LAN IP of the Docker host
  (the manager's port 1514 is published on the host), not a container name.
-->
<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22, ubuntu24</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- Runtime configuration is delivered from the manager. -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!--
    Giftastic structured security audit log.
    Set SECURITY_AUDIT_LOG_FILE on the backend to an absolute path if the
    process working directory is not the backend project root.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/opt/giftastic/logs/security-audit.log</location>
  </localfile>

  <!-- Spring Boot console/application log (plain text). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/opt/giftastic/logs/giftastic-application.log</location>
  </localfile>

  <!-- Auditd integration (account changes, privilege use) on Linux. -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- File integrity monitoring over the deployed artifacts and configuration. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes">/opt/giftastic</directories>
    <directories check_all="yes">/etc/systemd/system</directories>
    <ignore type="sregex">\.log$|\.tmp$|/logs/</ignore>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
</ossec_config>
